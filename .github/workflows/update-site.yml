name: Update Live Scores

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Update scores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scores.py
      - name: Save new scores
        run: |
          git config user.name "WorldStatsHub Bot"
          git config user.email "bot@worldstatshub.com"
          git add scores.json world-stats-hub/scores.json || true
          git commit -m "Live scores update" || echo "No change"
          git push
