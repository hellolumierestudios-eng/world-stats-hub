name: Run Bot Every Hour
on: schedule:
- cron: * 0 * * * *
workflow_dispatch:
jobs:
run-bot:
runs- on: ubuntu-latest
steps:
- uses: action/checkout@v5
- uses: actions/setup- python@v5
with:
python - version: '3.11'
- run: pip install -r requirements. txt|| pip install python - telegram - bot request 
- run: python main.py
env:
BOT_TOKEN: ${{ secrets. BOT_TOKEN }}
