name: Run Bot Every Hour
"on":
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

 jobs:
run-bot:    
runs-on: ubuntu-latest
steps:    
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: install deps
      run: pip install -r requirements.txt
    - name: run bot
      run: python main.py
      env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

