<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Stats Hub</title>
<style>
body{background:#0f1226;color:white;font-family:Arial;padding:16px;margin:0}
h1{text-align:center}
.badge{background:#16a34a;display:inline-block;padding:5px 12px;border-radius:20px;font-size:13px}
.card{background:#1a1e3f;padding:14px;border-radius:12px;margin:12px 0}
.score{font-size:22px;font-weight:bold;margin:6px 0}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<h1>🌍 WORLD STATS HUB</h1>
<center><span class="badge">● LIVE</span> <span id="updated"></span></center>
<div id="list">Loading...</div>

<script>
async function load(){
  try{
    const r = await fetch('scores.json?v='+Date.now());
    const data = await r.json();
    const matches = data.matches || data.events || data || [];
    document.getElementById('updated').textContent = 'Updated: ' + (data.updated || data.date || '');
    let html = '';
    matches.forEach(m=>{
      // Try EVERY possible name for teams and score
      let home = m.home || m.homeTeam || m.home_team || (m.teams && m.teams.home) || (m.competitors && m.competitors[0]) || '';
      let away = m.away || m.awayTeam || m.away_team || (m.teams && m.teams.away) || (m.competitors && m.competitors[1]) || '';
      if(typeof home==='object') home = home.name || home.displayName || home.team?.displayName || '';
      if(typeof away==='object') away = away.name || away.displayName || away.team?.displayName || '';

      // Try EVERY possible name for score
      let hs = m.homeScore ?? m.home_score ?? m.homeGoals ?? m.score_home ?? m.home_goals ?? m.homeResult ?? '';
      let as = m.awayScore ?? m.away_score ?? m.awayGoals ?? m.score_away ?? m.away_goals ?? m.awayResult ?? '';
      // If score is in one string like "2 - 1" or "2-1"
      if((hs===''||hs===undefined) && m.score) {
        let parts = String(m.score).split(/[-:]/);
        if(parts.length>=2){ hs=parts[0].trim(); as=parts[1].trim(); }
      }
      if((hs===''||hs===undefined) && m.result) {
        let parts = String(m.result).split(/[-:]/);
        if(parts.length>=2){ hs=parts[0].trim(); as=parts[1].trim(); }
      }
      // ESPN raw format: competitors[0].score
      if((hs===''||hs===undefined) && m.competitions){
        try{
          let comps = m.competitions[0].competitors;
          let h = comps.find(c=>c.homeAway==='home');
          let a = comps.find(c=>c.homeAway==='away');
          hs = h?.score; as = a?.score;
          home = home || h?.team?.displayName;
          away = away || a?.team?.displayName;
        }catch(e){}
      }
      if(hs===undefined||hs===null||hs==='') hs='-';
      if(as===undefined||as===null||as==='') as='-';

      let league = m.league || m.competition || m.leagueName || m.tournament || '';
      let status = m.status || m.state || m.statusText || 'Full Time';
      if(typeof status==='object') status = status.type?.detail || status.displayName || 'Full Time';

      html += `<div class="card"><div class="score">${home} ${hs} - ${as} ${away}</div><div class="small">${league} • ${status}</div></div>`;
    });
    document.getElementById('list').innerHTML = html || 'No matches found';
  }catch(e){
    document.getElementById('list').innerHTML = 'Error loading scores: '+e;
  }
}
load();
</script>
</body>
</html>
