<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Stats Hub - Live Scores</title>
<style>
body{font-family:Arial;background:#0a0f1e;color:white;margin:0;padding:15px}
h1{text-align:center} .card{background:#141b33;padding:15px;border-radius:12px;margin:10px 0}
.badge{background:green;padding:3px 8px;border-radius:20px;font-size:12px}
.score{font-size:20px;font-weight:bold} .small{color:#aaa;font-size:13px}
button{background:#0088cc;color:white;border:none;padding:10px 20px;border-radius:20px;width:100%}
</style>
</head>
<body>
<h1>🌍 WORLD STATS HUB</h1>
<p style="text-align:center"><span class="badge">● LIVE</span> <span id="updated">Loading...</span></p>

<div class="card">
<h2>⚽ Latest Matches</h2>
<div id="matches">Loading live scores...</div>
</div>

<div class="card">
<h2>🚨 Transfer News</h2>
<div id="transfers">Loading transfers...</div>
</div>

<div class="card">
<h2>🌟 Player Life</h2>
<div id="player">Loading player story...</div>
</div>

<p style="text-align:center"><a href="https://t.me/worldstatshub" style="color:#4fc3f7">Follow @WorldStatsHub on Telegram</a></p>
<button onclick="loadData()">🔄 Refresh Scores</button>

<script>
async function loadData(){
  try{
    const r = await fetch('scores.json?v=' + Date.now());
    const d = await r.json();
    document.getElementById('updated').innerText = 'Updated: ' + d.updated;
    let mHtml = '';
    d.matches.forEach(m=>{
      mHtml += `<p><b>${m.home}</b> <span class="score">${m.score}</span> <b>${m.away}</b><br><span class="small">${m.league} • ${m.status}</span></p><hr>`;
    });
    document.getElementById('matches').innerHTML = mHtml || 'No games today';
    document.getElementById('transfers').innerHTML = d.transfers || 'No transfer news yet';
    document.getElementById('player').innerHTML = d.player_life || 'Player story coming soon';
  }catch(e){
    document.getElementById('matches').innerHTML = 'No internet - showing last saved scores. Please refresh.';
  }
}
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
